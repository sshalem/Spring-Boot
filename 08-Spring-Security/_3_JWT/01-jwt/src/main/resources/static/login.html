<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>login</title>
    <script src="https://kit.fontawesome.com/c3d49f7cef.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <section class="container">
      <div class="form">
        <div class="form-stripe"></div>
        <div class="form-header"><i class="fa fa-user"></i><span class="form-header-span">login</span></div>
        <div class="form-control">
          <div class="form-label"><label for="email">email</label></div>
          <div class="form-input"><input type="text" name="email" id="email" /></div>
        </div>
        <div class="form-control">
          <div class="form-label"><label for="password">password</label></div>
          <div class="form-input"><input type="password" name="password" id="password" /></div>
        </div>
        <div class="form-control">
          <div class="form-button">
            <button class="form-btn" id="login">login</button>
          </div>
        </div>
        <div class="form-register">
          Not a member yet?<span class="form-span"><a href="register.html" id="gotoRegeister">Register</a></span>
        </div>
      </div>
    </section>
    <script src="/js/index.js"></script>
  </body>
</html>
