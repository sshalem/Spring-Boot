<h1>Login</h1>
<div class="container">
  <div class="alert alert-warning" *ngIf="invalidLogin">{{ errorMessage }}</div>
  <div>
    User Name
    <br />
    <p>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        (keyup.enter)="onEnterKeyUp()"
      />
    </p>
    Password
    <br />
    <p>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        (keyup.enter)="onEnterKeyUp()"
      />
    </p>
  </div>
  <div>
    <button class="btn btn-success" (click)="handleBasicAuthLogin()">
      login
    </button>
  </div>
</div>
