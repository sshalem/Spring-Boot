<h1>Todo</h1>

<div class="container">
  <div class="alert alert-warning" *ngIf="todoForm.dirty && todoForm.invalid">
    Enter Valid values
  </div>
  <!-- <div class="alert alert-warning" *ngIf="todoForm.dirty && targetDate.invalid">
    Enter Valid Target
  </div>
  <div
    class="alert alert-warning"
    *ngIf="todoForm.dirty && description.invalid"
  >
    Enter minimum 5 charecters
  </div> -->
  <form (ngSubmit)="!todoForm.invalid && saveTodo()" #todoForm="ngForm">
    <fieldset class="form-group">
      <label>Description</label>
      <input
        type="text"
        #description="ngModel"
        [(ngModel)]="todo.description"
        class="form-control"
        name="description"
        id=""
        required="required"
        minlength="5"
      />
      <div
        class="alert alert-warning"
        *ngIf="todoForm.dirty && description.invalid"
      >
        Enter minimum 5 charecters
      </div>
    </fieldset>
    <fieldset class="form-group">
      <label>Target Date</label>
      <input
        type="date"
        #targetDate="ngModel"
        [ngModel]="todo.targetDate | date: 'yyyy-MM-dd'"
        (ngModelChange)="todo.targetDate = $event"
        class="form-control"
        name="targetDate"
        id=""
        required="required"
      />
      <div
        class="alert alert-warning"
        *ngIf="todoForm.dirty && targetDate.invalid"
      >
        Enter Valid Target
      </div>
    </fieldset>
    <button type="submit" class="btn btn-success">Save</button>
  </form>
</div>
