<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
        <link rel="stylesheet" href="./css/admin.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <div class="header__title">
                    <h1>Admin Page</h1>
                </div>
                <div class="header__log-info">
                    <div class="logged-user">hello <span id="user-logged"></span></div>
                    <div class="logout">
                        <form action="http://localhost:8080/logout" method="post">
                            <button type="submit" class="btn-logout">Logout</button>
                        </form>
                    </div>
                </div>
            </header>
            <!-- <article class="content">
                    <div class="content-method">
                        <div class="content-method-title">Update User (PUT)</div>
                        <div class="content-method-btn"><button class="btn putBtn">update</button></div>
                        <div class="content-method-inputs">
                            <div><span class="label-gap"> userId : </span><input id="inputUpdateUsername" type="text" /></div>
                            <div><span class="label-gap"> password : </span><input id="inputUpdatePassword" type="password" name="" /></div>
                            <div><span class="label-gap"> email : </span><input id="inputUpdateEmail" type="text" /></div>
                        </div>
                    </div>
             </article> -->
            <section class="section-content">
                <article class="content-method">
                    <div>
                        <div class="content-method-btn"><button class="btn createBtn">Create User</button></div>
                        <div id="toggle-inputs" class="content-method-inputs visible">
                            <div><input id="inputCreateUsername" type="text" placeholder="Enter username" /></div>
                            <div><input id="inputCreatePassword" type="text" placeholder="Enter password" /></div>
                            <div><input id="inputCreateEmail" type="text" placeholder="Enter email" /></div>
                            <div class="content-method-btn"><button class="btn postBtn">create</button></div>
                        </div>
                    </div>
                    <div class="content-method-btn"><button class="btn getBtn btnGetAll">get All</button></div>
                    <div>
                        <div class="content-method-btn"><button class="btn getBtn btnGetById">get User By Id</button></div>
                        <div id="input-getById"><input id="inputGetById" type="text" required="" placeholder="Enter userId" /></div>
                    </div>
                    <div>
                        <div class="content-method-btn"><button class="btn getBtn btnGetByUsername">get User by name</button></div>
                        <div id="input-getByName"><input id="inputGetByUsername" type="text" placeholder="Enter username" /></div>
                    </div>
                </article>
                <article id="errorGetById" class="article-error visible">
                    <div class="errorMessage">message</div>
                </article>
                <article>
                    <table>
                        <thead>
                            <tr>
                                <th>userId</th>
                                <th>username</th>
                                <th>email</th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="getAllUserFromServer"></tbody>
                    </table>
                </article>
            </section>
        </div>
        <script type="module" src="./js/admin.js"></script>
    </body>
</html>
