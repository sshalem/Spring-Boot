<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <div class="container">
            <div>
                <h1>Landing page hello spring security</h1>
                <hr />
                <br />
                <div class="buttons">
                    <button id="v1-1">url-1</button>
                    <button id="v1-2">url-2</button>
                    <button id="v1-3">url-3</button>
                    <button id="test">url-test</button>
                </div>
                <br />
                <br />
            </div>
            <div id="result"></div>
            <table>
                <tr>
                    <td class="td_method post">POST</td>
                    <td>name :</td>
                    <td><input type="text" name="" id="studentName" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td>id :</td>
                    <td><input type="number" name="" id="studentId" /></td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: center"><button id="sendData">send</button></td>
                </tr>
            </table>
            <br />
            <table>
                <tr>
                    <td class="td_method put">PUT</td>
                    <td>update name :</td>
                    <td><input type="text" name="" id="updateName" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td>update id :</td>
                    <td><input type="number" name="" id="updateId" /></td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: center"><button id="updateData">update</button></td>
                </tr>
            </table>
            <br />
            <table>
                <tr>
                    <td class="td_method delete">DELETE</td>
                    <td>delete name :</td>
                    <td><input type="text" name="" id="deleteName" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td>delete id :</td>
                    <td><input type="number" name="" id="deleteId" /></td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: center"><button id="deleteData">delete</button></td>
                </tr>
            </table>
            <br />
            <table>
                <tr>
                    <td colspan="3" style="text-align: center">
                    	<div>
                    		<form action="/logout" method="post">
                    			<input name="_csrf" type="hidden" value="" id="csrfId">
                    			<button type="submit">logout</button>
                    		</form>
                    	</div>
                    </td>
                </tr>
            </table>
            <div id="dataFromServer"></div>
        </div>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
