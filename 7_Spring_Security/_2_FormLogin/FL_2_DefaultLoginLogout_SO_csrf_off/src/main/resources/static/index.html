<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>

    <body>
        <div class="container">
            <header>
                <h1>FormLogin With Spring Security</h1>
            </header>
            <!-- seperator -->
            <div class="seperator"></div>
            <!-- Logout Button -->
            <div class="logout">
                <form action="/logout" method="post">
                    <button class="logout-btn" type="submit">Logout</button>
                </form>
                <a href="/logout">LogoutAnchor</a>
            </div>
            <!-- Start Section get methods -->
            <section class="get_methods">
                <div class="get_methods_div">
                    <div>
                        <button class="get_methods_btn" id="getAllUsers"><span class="get_methods_label">Get All Users</span></button>
                    </div>
                    <div class="get_methods_input"></div>
                    <div class="get_methods_validate"></div>
                </div>
                <div class="get_methods_div">
                    <div>
                        <button class="get_methods_btn" id="getUserByName"><span class="get_methods_label">Get User By Name</span></button>
                    </div>
                    <div class="get_methods_input">
                        <input type="text" name="" id="username" placeholder="name" />
                    </div>
                    <div class="get_methods_validate">
                        <div id="toggleErrorUsername" class="show_error hidden_username">Empty field not allowed</div>
                    </div>
                </div>
                <div class="get_methods_div">
                    <div>
                        <button class="get_methods_btn" id="getUserById"><span class="get_methods_label">Get User By Id</span></button>
                    </div>
                    <div class="get_methods_input">
                        <input type="number" name="" id="userId" placeholder="user ID" />
                    </div>
                    <div class="get_methods_validate">
                        <div id="toggleErrorUserId" class="show_error hidden_id">Empty field not allowed</div>
                    </div>
                </div>
                <div class="get_methods_div">
                    <div>
                        <button class="get_methods_btn" id="createUser"><span class="get_methods_label">Create New User</span></button>
                    </div>
                    <div class="createUser__input visible" id="toggle-inputs">
                        <div class="createUser__input_div_child">
                            <input type="text" name="" id="userName" placeholder="username" />
                        </div>
                        <div class="createUser__input_div_child">
                            <input type="text" name="" id="password" placeholder="password" />
                        </div>
                        <div class="createUser__input_div_child">
                            <input type="text" name="" id="email" placeholder="email" />
                        </div>
                        <div class="createUser__input_div_child">
                            <select name="roles" id="roleName">
                                <option value=""></option>
                                <option value="SUPERADMIN">SUPER-ADMIN</option>
                                <option value="ADMIN">ADMIN</option>
                                <option value="USER">USER</option>
                            </select>
                        </div>

                        <div class="createUser__input_div_child">
                            <button class="createBtn"><span class="createBtnSpan">Create</span></button>
                        </div>
                    </div>
                </div>
            </section>
            <!-- End Section get methods -->
            <br />
            <br />
            <br />
            <table class="table__users">
                <thead>
                    <th>Id</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Roles</th>
                    <th></th>
                </thead>
                <tbody id="tbody">
                    <!-- <tr class="table__users-tbody-tr">

                        <td class="table__users-tbody-td">c</td>
                    </tr> -->
                </tbody>
            </table>

                </div> -->

        </div>
        <script type="module" src="./js/app.js"></script>
