<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <link rel="stylesheet" href="style.css" />
    <body>
        <header>
            <p>user home Page</p>
        </header>
        <section class="main">
            <nav class="nav">
                <div class="div-btns">
                    <button id="home">home</button>
                </div>
                <div class="div-btns">
                    <button id="btnCreateUser">create user</button>
                </div>
                <div class="div-btns">
                    <button id="btnAllUsers">get All Users</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetUserById">get user by id</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetUserByEmail">get User By Email</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetUserByFirstname">get User By Firstname</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetUsersByPostDetailsContent">get user by post details</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetUserWhereFirstnameContains">get user where first name contains</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetPostByUserId">get posts by user id</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetPostByUserFirstname">get posts by user firstname</button>
                </div>
                <div class="div-btns">
                    <button id="btnGetPostByUserEmail">Get Posts By User Email</button>
                </div>
            </nav>
            <aside class="aside">
                <div class="aside__content">
                    <div style="width: 50vw">
                        welcome to <span class="aside__text">users home Page</span>, please choose one of the options from the nav on the side
                    </div>
                </div>
            </aside>
        </section>
        <script src="app.js" type="module"></script>
    </body>
</html>
