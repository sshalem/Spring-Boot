<!DOCTYPE html>
<html>
  <head>
    <title>Hello WebSocket</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />

    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

    <!-- Latest compiled JavaScript -->
    <link rel="stylesheet" href="style.css" />
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="col-md-9">
        <br />
        <div class="form-group">
          <label>WebSocket connection:</label>
          <div id="connect" class="btn btn-default">Connect</div>
          <div id="disconnect" class="btn btn-default hide">Disconnect</div>
        </div>
      </div>
      <div class="col-md-9">
        <br />
        <div class="form-group">
          <label for="message-input">Write a message</label>
          <input type="text" id="message-input" class="form-control" placeholder="Your name here..." />
        </div>
        <div id="sendMessage" class="btn btn-default">Send</div>
      </div>
      <br />
      <section class="col-md-9">
        <br />
        <div class="form-group" id="messages"></div>
      </section>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
