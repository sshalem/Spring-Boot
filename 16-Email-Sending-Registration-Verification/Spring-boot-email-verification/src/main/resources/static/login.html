<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Please sign in</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
        <script src="https://kit.fontawesome.com/c3d49f7cef.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div style="width: 600px; margin-left: auto; margin-right: auto; margin-top: 24px; padding: 24px">
                <div class="card">
                    <div class="card-header" style="background-color: #1e90ff"><i class="fa fa-user" style="font-size: 24px"></i> Please Login</div>
                    <div class="card-block" style="padding: 24px">
                        <form class="form-signin" method="post" action="/login">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Username"
                                    required=""
                                    autofocus=""
                                />
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required="" />
                            </div>
                            <!-- <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="checkRememberMe" name="checkRememberMe" />
                                <label class="form-check-label" for="checkRememberMe">Remember me</label>
                            </div> -->
                            <!-- <input type="hidden" name="_csrf" value="0df7ad53-7259-44dd-8dcc-8839aae248fb">  -->
                            <div id="csrfAdd"></div>
                            <div class="form-actions" style="margin-top: 12px">
                                <button type="submit" class="btn btn-success btn-block" style="background-color: #1e90ff">Log in</button>
                            </div>
                            <br />
                            <div id="err"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script>
            // var ck = document.cookie;
            // var splitCookie = ck.split("=");
            // console.log(ck);
            // console.log(splitCookie);
            // const csrfAdd = document.getElementById("csrfAdd");

            // window.addEventListener("load",()=>{
            // 	csrfAdd.innerHTML = `<input type="hidden" name="_csrf" value="${splitCookie[1]}">`;
            // });

            const errorMsg = document.getElementById('err');

            if (window.location.search != '' && window.location.search.includes('BadCredentials')) {
                errorMsg.innerHTML = `
            <div class="alert alert-danger">Bad Credentials</div>
            `;
            } else if (window.location.search != '' && window.location.search.includes('UserDisabled')) {
                errorMsg.innerHTML = `
            <div class="alert alert-danger">User is disabled, check your email to activate account</div>
            `;
            } else if (window.location.search != '' && window.location.search.includes('UserLocked')) {
                errorMsg.innerHTML = `
            <div class="alert alert-danger">User is locked</div>
            `;
            } else if (window.location.search != '' && window.location.search.includes('UserAccountExpired')) {
                errorMsg.innerHTML = `
            <div class="alert alert-danger">User Account Expired</div>
            `;
            }
        </script>
    </body>
</html>
