<!DOCTYPE html>
<html>
    <head>
        <meta charset="ISO-8859-1" />
        <title>Sign Up - CodeJava</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div class="container text-center">
            <div>
                <h1>User Registration - Sign Up</h1>
            </div>
            <form action="http://localhost:8080/processRegister" method="POST" style="max-width: 600px; margin: 0 auto">
                <div class="m-3">
                    <div class="form-group row">
                        <label class="col-4 col-form-label">E-mail: </label>
                        <div class="col-8">
                            <input type="text" name="email" class="form-control" required />
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-4 col-form-label">Password: </label>
                        <div class="col-8">
                            <input type="password" name="password" class="form-control" required maxlength="10" />
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-4 col-form-label">First Name: </label>
                        <div class="col-8">
                            <input type="text" name="firstName" class="form-control" required maxlength="20" />
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-4 col-form-label">Last Name: </label>
                        <div class="col-8">
                            <input type="text" name="lastName" class="form-control" required maxlength="20" />
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                    </div>
                    <br />
                    <div id="err"></div>
                </div>
            </form>
        </div>
        <script>
            if (window.location.search != '' && window.location.search.includes('Email=AlreadyExist')) {
                document.getElementById('err').innerHTML = `
            <div class="alert alert-danger">Email already exist.</div>
            `;
            }
        </script>
    </body>
</html>
