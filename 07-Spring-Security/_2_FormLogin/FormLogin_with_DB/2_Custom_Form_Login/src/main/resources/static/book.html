<!DOCTYPE html>
<html dir="rtl" lang="he">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
        <!-- <link rel="stylesheet" href="./css/style.css" /> -->
        <link rel="stylesheet" href="./css/book.css" />
        <script src="https://kit.fontawesome.com/c3d49f7cef.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <!-- start header -->
            <header id="header" class="header">
                <div class="header__date-banner">
                    <div class="header__banner">
                        <div><img src="./images/banner-1.jpg" alt="תלמוד בבלי" /></div>
                        <div><img src="./images/banner-2.jpg" alt="תלמוד בבלי" /></div>
                        <div><img src="./images/banner-3.jpg" alt="תלמוד בבלי" /></div>
                    </div>
                    <div class="header__date">
                        <!-- day/ gregorian/ hebrew  -->
                    </div>
                </div>
                <nav class="nav">
                    <ul class="nav-bar">
                        <il class="nav-item" id="nav-all-books">כל הספרים</il>
                        <il class="nav-item">תורה</il>
                        <il class="nav-item">נביאים</il>
                        <il class="nav-item">כתובים</il>
                        <il class="nav-item">מגילות</il>
                    </ul>
                </nav>
                <div class="header__user">
                    <div class="header__logged-user">שלום <span id="header__logged-user"></span></div>
                    <div>
                        <form action="http://localhost:8080/logout" method="post">
                            <button type="submit" class="header__btn-logout">יציאה</button>
                        </form>
                    </div>
                </div>
            </header>
            <!-- end header -->
            <!-- start side nav bar -->
            <aside id="aside">
                <ul class="aside-ul-container">
                    <!-- ------------------------------------- -->
                    <li class="aside-li">
                        <div class="aside-li-description">
                            <div class="aside-li-allbooks">כל הספרים</div>
                        </div>
                    </li>
                    <!-- ------------------------------------- -->
                    <li class="aside-li" data-name="bookname">
                        <div class="aside-li-description" data-name="bookname">
                            <div class="aside-li-bookname" data-name="bookname">חפש לפי שם ספר</div>
                            <div id="bookname-arrow-status" class="aside-li-arrow down" data-name="bookname">
                                <i class="fas fa-angle-down" data-name="bookname"></i>
                            </div>
                        </div>
                        <div id="input-data-bookname" class="aside-li-input-data">
                            <div><input type="text" placeholder="הכנס שם ספר" /></div>
                            <div class="aside-li-search">חפש</div>
                        </div>
                    </li>
                    <!-- ------------------------------------- -->
                    <li class="aside-li" data-name="author">
                        <div class="aside-li-description" data-name="author">
                            <div class="aside-li-author" data-name="author">חפש לפי שם סופר</div>
                            <div id="author-arrow-status" class="aside-li-arrow down" data-name="author">
                                <i class="fas fa-angle-down" data-name="author"></i>
                            </div>
                        </div>
                        <div id="input-data-author" class="aside-li-input-data">
                            <div><input type="text" placeholder="הכנס שם סופר" /></div>
                            <div class="aside-li-search">חפש</div>
                        </div>
                    </li>
                    <!-- ------------------------------------- -->
                    <li class="aside-li" data-name="year">
                        <div class="aside-li-description" data-name="year">
                            <div class="aside-li-year" data-name="year">חפש לפי שנת הוצאה</div>
                            <div id="year-arrow-status" class="aside-li-arrow down" data-name="year">
                                <i class="fas fa-angle-down" data-name="year"></i>
                            </div>
                        </div>
                        <div id="input-data-year" class="aside-li-input-data">
                            <div><input type="text" placeholder="הכנס שנת הוצאה" /></div>
                            <div class="aside-li-search">חפש</div>
                        </div>
                    </li>
                    <!-- ------------------------------------- -->
                    <li class="aside-li end">
                        <div class="aside-li-last-li"></div>
                    </li>
                </ul>
            </aside>
            <!-- end side nav bar -->
            <!-- start vertical line seperator -->
            <section class="vertical_column-seperator">
                <!-- column seperator -->
            </section>
            <!-- end vertical line seperator -->
            <!-- start main -->
            <main>
                <section class="books-container">
                    <!--  -->
                </section>
            </main>
            <!-- end main -->
            <!-- start pagination -->
            <section class="pagination-container">
                <div class="pagination"></div>
                <!-- -->
                <div class="container-books-per-page">
                    <div id="books-per-page-selected">
                        <div><i class="fas fa-caret-down"></i></div>
                        <div id="current-books-per-page">
                            <!-- current selection -->
                        </div>
                    </div>
                    <div class="dropdown-content">
                        <div class="books-per-page book-10">10 ספרים בעמוד</div>
                        <div class="books-per-page book-15">15 ספרים בעמוד</div>
                        <div class="books-per-page book-20">20 ספרים בעמוד</div>
                        <div class="books-per-page book-25">25 ספרים בעמוד</div>
                    </div>
                </div>
            </section>
            <!-- end pagination -->
            <!-- start footer -->
            <footer id="footer">copyright &copy; ספרי קודש <span id="date">year is update dynamically by JS code</span> .כל הזכויות שמורות</footer>
            <!-- end footer -->
        </div>
        <script type="module" src="./js/books/book.js"></script>
    </body>
</html>
