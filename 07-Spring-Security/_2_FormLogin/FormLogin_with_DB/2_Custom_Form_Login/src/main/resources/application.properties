# ==============================================================
# 		Configuration for Connectiong to MySql 
# ===============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/from_login?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
 
#Spring will create a schema
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
#spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy

# dev-tools (Need to add dependency)
spring.devtools.restart.enabled=true

# to Initialize DB by using a file of "data.sql" 
spring.datasource.platform=mysql
spring.datasource.initialization-mode=always



